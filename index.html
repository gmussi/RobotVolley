<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="description" content="Robot Volley — rally, customize, and smash in a neon sci-fi volleyball arena. 1v1 arcade sports for browser and mobile.">
  <meta property="og:title" content="Robot Volley">
  <meta property="og:description" content="Rally. Customize. Smash. A neon sci-fi volleyball game for two players.">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Robot Volley">
  <meta name="twitter:description" content="Rally. Customize. Smash.">
  <meta name="twitter:image" content="/og-image.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Fonts are self-hosted via @fontsource (imported in src/main.js) so the app runs fully offline. -->
  <title>Robot Volley</title>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div id="splashLogo">ROBOT VOLLEY</div>
    <div id="splashBar"><div id="splashFill"></div></div>
  </div>
  <div id="stage">
    <div id="wrap">
      <canvas id="game"></canvas>
    </div>
  </div>
  <div id="customizePanel" class="neon-panel hidden">
    <div class="panel-header">
      <span class="panel-title">ROBOT LAB</span>
      <button id="labClose" type="button" class="neon-btn small" aria-label="Close">✕</button>
    </div>
    <div id="labContent"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
