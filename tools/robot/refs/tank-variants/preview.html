<!DOCTYPE html><html><head><meta charset='utf-8'><title>Tank bodies</title>
<style>body{font-family:system-ui,sans-serif;background:#0a0e1a;color:#f5f7ff;margin:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:#121828;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px}
.card img{width:100%;background:#060912;border-radius:8px}
.num{color:#29b6f6;font-size:1.4rem;font-weight:700}</style></head>
<body><h1>Tank bodies — hull and tracks in one piece</h1>
<p>Tell the agent <code>apply variant 3</code>.</p><div class='grid'>
<div class='card'><div class='num'>#1</div><img src='variant-01.webp'><p>01-classic</p></div>
<div class='card'><div class='num'>#2</div><img src='variant-02.webp'><p>02-glacis</p></div>
<div class='card'><div class='num'>#3</div><img src='variant-03.webp'><p>03-neon</p></div>
<div class='card'><div class='num'>#4</div><img src='variant-04.webp'><p>04-apc</p></div>
<div class='card'><div class='num'>#5</div><img src='variant-05.webp'><p>05-dome</p></div>
<div class='card'><div class='num'>#6</div><img src='variant-06.webp'><p>06-siege</p></div>
<div class='card'><div class='num'>#7</div><img src='variant-07.webp'><p>07-recon</p></div>
<div class='card'><div class='num'>#8</div><img src='variant-08.webp'><p>08-industrial</p></div>
<div class='card'><div class='num'>#9</div><img src='variant-09.webp'><p>09-retro</p></div>
<div class='card'><div class='num'>#10</div><img src='variant-10.webp'><p>10-minimal</p></div>
</div></body></html>
