name: Desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac-arm64
            artifact_path: release/mac-arm64
          - os: windows-latest
            artifact: win-unpacked
            artifact_path: release/win-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare Apple API key (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "APPLE_API_KEY_P8 not set — notarization will be skipped after sign"
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - name: Import code signing certificate (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set — building unsigned"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          if echo "$CSC_LINK" | base64 --decode > "$CERT_PATH" 2>/dev/null; then
            echo "Decoded base64 CSC_LINK to $CERT_PATH"
          else
            printf '%s' "$CSC_LINK" > "$CERT_PATH"
            echo "Wrote raw CSC_LINK to $CERT_PATH"
          fi
          echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
      - run: npm run electron:build -- --publish never
        env:
          VITE_MATCHMAKING_URL: ${{ vars.VITE_MATCHMAKING_URL }}
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Verify macOS signature + notarization
        if: matrix.os == 'macos-latest'
        run: spctl -a -vvv "release/mac-arm64/Robot Volley.app"
      - name: Smoke tests (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          npx electron electron/smoke.cjs
          npx electron electron/smoke-save.cjs
          npx electron electron/smoke-steam.cjs
          npx electron electron/smoke-quit.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: robot-volley-${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14
